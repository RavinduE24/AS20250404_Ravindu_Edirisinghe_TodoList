<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    
    <!-- We bring in Bootstrap 5 to handle the responsive grid and basic styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Our custom stylesheet is linked after Bootstrap so our rules take priority -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">My To-Do List</span>
        </div>
    </nav>

    <!-- Main App Container -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <!-- The white card holding our application -->
                <div class="card shadow-sm">
                    <div class="card-body">
                        
                        <!-- Header Section -->
                        <h3 class="card-title text-center mb-1">Task Manager</h3>
                        <p class="text-muted text-center mb-4">Organize your tasks and stay productive.</p>

                        <!-- Input Area: Where users type new tasks -->
                        <div class="input-group mb-2">
                            <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task...">
                            <button class="btn btn-primary" id="addTaskBtn">Add Task</button>
                        </div>
                        
                        <!-- This error message stays hidden until the user tries to add an empty task -->
                        <div id="errorMessage" class="text-danger small mb-3 d-none">Please enter a valid task.</div>

                        <!-- Task Counter Display -->
                        <div class="d-flex justify-content-between align-items-center mb-2 mt-4">
                            <span>Your tasks</span>
                            <span id="taskCounter" class="badge bg-primary rounded-pill">0 remaining</span>
                        </div>

                        <!-- Filter Buttons: All, Active, Completed -->
                        <div class="btn-group w-100 mb-3" role="group">
                            <input type="radio" class="btn-check" name="filterGroup" id="filterAll" checked>
                            <label class="btn btn-outline-primary" for="filterAll">All</label>

                            <input type="radio" class="btn-check" name="filterGroup" id="filterActive">
                            <label class="btn btn-outline-primary" for="filterActive">Active</label>

                            <input type="radio" class="btn-check" name="filterGroup" id="filterCompleted">
                            <label class="btn btn-outline-primary" for="filterCompleted">Completed</label>
                        </div>

                        <!-- The actual list where our JavaScript will add new list items -->
                        <ul id="taskList" class="list-group mb-3">
                            <!-- Items appear here -->
                        </ul>

                        <!-- Bottom Section: Clear Completed Button -->
                        <div class="d-flex justify-content-end">
                            <button id="clearCompletedBtn" class="btn btn-outline-danger btn-sm">Clear Completed</button>
                        </div>

                    </div>
                </div>
                
            </div>
        </div>
    </div>

    <!-- Link to our JavaScript logic at the very bottom so the HTML loads first -->
    <script src="script.js"></script>
</body>
</html>
